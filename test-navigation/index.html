<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Test de navigation</title>
<!-- Test temporaire : un écran peut-il ouvrir une autre page du document, positionnée sur une ligne ?
     Paramètre d'URL : ?cible=<adresse complète de la page avec l'ancre #a1.sX.rY.cZ> -->
<script src="../lib/grist-plugin-api.js"></script>
<style>body{font:15px system-ui,sans-serif;padding:20px} a{display:inline-block;margin:8px 12px 8px 0;padding:8px 14px;border:1px solid #000091;border-radius:6px;color:#000091;text-decoration:none} code{font-size:12px;color:#666}</style>
</head>
<body>
<h3>Test de navigation entre pages</h3>
<p>Cible : <code id="c"></code></p>
<a id="top" target="_top">1. Ouvrir dans le même onglet</a>
<a id="blank" target="_blank" rel="noopener">2. Ouvrir dans un nouvel onglet</a>
<script>
const cible = new URLSearchParams(location.search).get('cible') || '';
document.getElementById('c').textContent = cible;
document.getElementById('top').href = cible; document.getElementById('blank').href = cible;
grist.ready({ requiredAccess: 'none' });
</script>
</body>
</html>
